[project]
name = "superhero-mythology-bot"
version = "0.1.0"
description = "FastAPI chatbot answering questions about Norse/Greek mythology and comic-book superheroes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.159.1",
    "httpx>=0.28.1",
    "openai>=3.36.1",
    "pydantic-settings>=2.16.1",
    "rank-bm25>=0.2.2",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
